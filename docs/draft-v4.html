<style>

    --hl0: #6A5A14; --hl1: #6E3D1D; --good: #8CCB86; --bad: #FF9A8A; --warn: #F0C060;
    --g1: #8CCB86; --g2: #7FB2F0; --g3: #F58FB0; --g4: #F0A458; --g5: #B9A4F5; --g6: #6FCBD6;
    --pill-lit: #30302E; --pill-cls: #3A332B; --pill-anc: #3F3519; --pill-grp: #2B3327; --pill-alt: #332E40; --pill-q: #D97757;

}

  --accent: #D97757; --accent-hi: #E8906F; --accent-text: #E8906F; --accent-ink: #1F1E1D; --accent-soft: #3A2A22;

.explain li { display: flex; gap: 8px; align-items: baseline; }

.ptabs { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.ptab { border: 0; background: transparent; padding: 7px 12px; min-height: 38px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.ptab[aria-selected="true"] { color: var(--accent-text); border-bottom-color: var(--accent-text); font-weight: 700; }

.pbtn { border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 5px 8px; min-height: 48px; text-align: left; display: flex; flex-direction: column; justify-content: center; }

.key:active, .key.down { background: var(--accent-soft); border-color: var(--accent-text); }

/* 미리보기 */
.stabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; align-items: center; }
.stab { flex: 0 0 auto; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 3px 10px; min-height: 32px; font-size: 13px; }
.stab[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent-text); color: var(--accent-text); font-weight: 700; }
.view { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-family: var(--mono); font-size: 14px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 90px; max-height: 360px; overflow: auto; }

.gtag i { font-style: normal; font-family: var(--font); color: var(--muted); margin-right: 4px; }
.out { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; max-height: 240px; overflow: auto; }
.note { border: 1px solid var(--line); background: var(--surface2); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--muted); margin: 8px 0; }

/* 테스트 */
.tgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .tgrid { grid-template-columns: minmax(0, 1fr); } }
.tlines { display: grid; gap: 3px; margin-top: 6px; }

.code { position: relative; }
.code pre { margin: 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; overflow: auto; font-family: var(--mono); font-size: 13px; line-height: 1.5; }

.sheet { width: 100%; max-width: 520px; max-height: 88%; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: var(--shadow); }

mark.sr { background: var(--hl0); color: inherit; }

#selBar { margin-top: 8px; padding: 8px; border-radius: 10px; background: var(--accent-soft); gap: 6px; align-items: center; margin-bottom: 12px; }
input[type=search].in { font-family: var(--font); }

input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent-text); }

.pickbtn { width: 100%; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 12px; min-height: 48px; text-align: left; margin-bottom: 10px; }

kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; color: var(--muted); background: var(--surface); flex: none; }

  const QRE = /^\{(?:\d+(?:,\d*)?|,\d+)\}/;
  const META = /[\\^$.|?*+()[\]{}]/;

  function mk(t, raw, extra) { return Object.assign({ t, raw, q: '' }, extra || {}); }

    let j = i + 1;
    if (s[j] === '^') j++;

    const c = s[i + 1];

  function groupOpen(s, i) {
    const r = s.slice(i);
    let m;

}
function loadHistoryItem(h) { guardDiscard(() => doLoadHistory(h)); }
function doLoadHistory(h) {

  S.pattern = h.pattern; S.flags = cleanFlags(h.flags || '', S.engine); S.repl = h.repl || ''; S.useRepl = !!h.useRepl;
  S.presetId = 'new'; S.dirty = false; S.undo = []; S.redo = []; S.builderOpen = true; S.selPath = null;

}
function menuSheet() {

      el('div', { class: 'row small muted' }, [(h.engine === 'py' ? 'Python' : 'JS') + (h.flags ? ' · 플래그 ' + h.flags : '') + (h.useRepl ? ' · 치환 있음' : ''), new Date(h.t).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })]),

}
function backupJson() { return JSON.stringify({ app: 'regex-workbench', version: 1, exportedAt: new Date().toISOString(), presets: S.userPresets, history: S.history }, null, 1); }
async function saveBackupFile() {
  try { const d = await claude.use('downloads'); if (!d) throw { code: 'unavailable' }; await d.save({ filename: 'regex-workbench-backup.json', data: backupJson() }); toast('백업 파일을 저장했습니다'); }
  catch (e) { if (e && e.code === 'declined') return; toast('백업 파일을 저장하지 못했습니다. JSON 복사로 보관해 주세요'); }
}
function cleanStr(v, max) { return typeof v === 'string' ? v.slice(0, max) : ''; }
function sanitizePreset(p) {
  if (!p || typeof p !== 'object' || typeof p.pattern !== 'string' || p.pattern.length > 4000) return null;
  const eng = p.engine === 'py' ? 'py' : 'js';
  const samples = (Array.isArray(p.samples) ? p.samples : []).slice(0, 20).filter((s) => s && typeof s.text === 'string').map((s) => ({ name: cleanStr(s.name, 40) || '예시', text: s.text.slice(0, 20000) }));
  return {
    id: uid(), name: cleanStr(p.name, 60) || '가져온 프리셋', desc: cleanStr(p.desc, 300), cat: '내 프리셋', pattern: p.pattern,
    flags: cleanFlags(cleanStr(p.flags, 10), eng), repl: cleanStr(p.repl, 1000), useRepl: !!p.useRepl,
    samples: samples.length ? samples : [{ name: '예시 1', text: '' }], must: cleanStr(p.must, 5000), mustnot: cleanStr(p.mustnot, 5000), testMode: p.testMode === 'full' ? 'full' : 'search', engine: eng

function validatePresets(arr) { return (Array.isArray(arr) ? arr : []).map((p) => { const q = sanitizePreset(p); if (q && p.id && typeof p.id === 'string') q.id = p.id.slice(0, 20); return q; }).filter(Boolean).slice(0, 500); }
function validateHistory(arr) {
  return (Array.isArray(arr) ? arr : []).filter((h) => h && typeof h.pattern === 'string' && h.pattern.length <= 4000).map((h) => {
    const e = { engine: h.engine === 'py' ? 'py' : 'js', pattern: h.pattern, flags: cleanFlags(cleanStr(h.flags, 10), h.engine === 'py' ? 'py' : 'js'), repl: cleanStr(h.repl, 1000), useRepl: !!h.useRepl, t: +h.t || Date.now() };

  out.textContent = '프리셋: 추가 ' + add + ', 중복 ' + dup + ', 제외 ' + skip + ' / 내역: 추가 ' + hAdd + ', 중복 ' + hDup + ', 제외 ' + hSkip;

/* ---------- 전체 동기화 · 시작 ---------- */

  renderSampleTabs(); setEditText(false); syncSampleFields();

function wireStatic() {

  $('btnCopyRepl').addEventListener('click', () => { copyText($('replOut').textContent, '치환 결과를 복사했습니다'); recordHistory(); });
  $('mustText').addEventListener('input', () => { S.must = $('mustText').value; markDirty(); scheduleTests(); persistState(); });
  $('mustNotText').addEventListener('input', () => { S.mustnot = $('mustNotText').value; markDirty(); scheduleTests(); persistState(); });
  const setTm = (m) => { S.testMode = m; $('tmSearch').setAttribute('aria-pressed', String(m === 'search')); $('tmFull').setAttribute('aria-pressed', String(m === 'full')); markDirty(); runTests(); persistState(); };
  $('tmSearch').addEventListener('click', () => setTm('search')); $('tmFull').addEventListener('click', () => setTm('full'));
  window.addEventListener('focus', async () => {
    if (!$('overlay').hidden || Store.mode === 'memory') return;
    S.userPresets = validatePresets(await Store.get('presets', S.userPresets));
    if (!S.userPresets.some((p) => p.id === S.presetId) && S.presetId !== 'new' && !findPreset(S.presetId)) S.presetId = 'new';
    S.history = validateHistory(await Store.get('history', S.history));

  });
  wirePatternField(); buildKeybar(); setDockTab(Pref.get('dockTab', 'type'), true);
}
async function init() {
